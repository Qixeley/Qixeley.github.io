<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Company Modding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Theme switcher -->
  <div id="themeSwitch" class="theme-switch">
    <label for="theme-toggle" class="switch">
      <input type="checkbox" id="theme-toggle" />
      <span class="slider"></span>
    </label>
    <span>Light Mode / Dark Mode</span>
  </div>

  <!-- Search Bar with Auto-Complete -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="🔎 Search items..." />
    <ul id="searchSuggestions" class="suggestions-list"></ul>
  </div>

  <!-- Item selection area -->
  <div class="item-selection">
    <label for="itemSelector">Choose an item:</label>
    <select id="itemSelector">
      <!-- Options will be dynamically added here -->
    </select>
  </div>

  <!-- More UI elements (sliders, text inputs) -->
  <!-- Your existing controls for hue, saturation, size scale, etc., can remain here -->

  <script src="script.js"></script>
</body>
</html>
